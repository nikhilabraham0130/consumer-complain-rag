[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "consumer-complaint-rag"
version = "0.1.0"
description = "Enterprise-Grade Consumer Complaint Intelligence & RAG System on CFPB Narratives"
authors = [
    { name = "Purdue Boilermaker Candidate" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "requests>=2.31.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
    "chromadb>=0.5.5",
    "sentence-transformers>=3.0.0",
    "rank_bm25>=0.2.2",
    "openai>=1.20.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
